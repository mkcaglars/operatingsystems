# Her "main" dalına gönderimde: testleri çalıştırır, siteyi derler ve derlenmiş siteyi "yayin" dalına koyar.
# Hostinger (hPanel > Gelişmiş > Git) bu "yayin" dalını public_html'e çeker. Ayrıntılar: docs/KURULUM.md
#
# İsteğe bağlı FTP yüklemesi (Git yerine): Settings > Secrets and variables > Actions
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Variables: FTP_DIR  (ör. "domains/isistem.mkcaglar.com/public_html/")
name: Derle ve Yayınla

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: yayinla-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # "yayin" dalına gönderebilmek için

jobs:
  derle:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring

      - name: Node paketleri
        run: npm ci --no-audit --no-fund

      - name: Testler (kural motoru TS + PHP, içerik)
        run: npm test

      - name: PHP kural testi
        run: npm run test:php

      - name: API uçtan uca testi
        run: npm run test:api

      - name: Siteyi derle
        run: npm run build

      - name: Derlenmiş siteyi sakla
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          include-hidden-files: true
          retention-days: 7

      - name: Derlenmiş siteyi "yayin" dalına gönder (Hostinger Git buradan çeker)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: bash scripts/yayin-dali.sh dist yayin

      - name: Hostinger'a yükle (FTP, isteğe bağlı)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR || 'domains/isistem.mkcaglar.com/public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            api/config.php
            data/**
